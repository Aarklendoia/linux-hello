name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libpam0g-dev \
            libv4l-dev \
            libjpeg-dev \
            libtss2-dev \
            libclang-dev \
            clang \
            pkg-config \
            dbus

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-ci-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        # Utilise le profil CI (pas --release) pour éviter LTO + codegen-units=1
        # qui rendent la compilation >1h. Les tests ne nécessitent pas les
        # optimisations release pour être corrects.
        env:
          # Pas de ORT_DYLIB_PATH : le fallback stub est utilisé si libonnxruntime absent
          LINUX_HELLO_NO_MODEL_DOWNLOAD: "1"
        run: |
          cargo test --all --profile ci

  # pam_linux_hello.so loaded by the real Linux-PAM through the real
  # pam-auth-update profile, on each Ubuntu series we publish for, with a fake
  # daemon on the helper socket (tests/pam-e2e/run.sh, #237). Catches what
  # unit tests can't: a control line Linux-PAM misparses, a service mapped to
  # the wrong context, a broken fallback to the password.
  pam-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        series: [ resolute, stonking ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build the PAM module
        run: cargo build -p pam_linux_hello --profile ci

      - name: Run PAM scenarios in ubuntu:${{ matrix.series }}
        run: |
          docker run --rm -v "$PWD:/src:ro" "ubuntu:${{ matrix.series }}" \
            bash /src/tests/pam-e2e/run.sh /src/target/ci/libpam_linux_hello.so
