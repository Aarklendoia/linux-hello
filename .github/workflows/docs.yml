name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A newer push to the same branch or PR supersedes a running build: only
# the latest commit's result matters, and stale runs otherwise queue up
# against the account's runner limit (five merges in a row meant five full
# runs on main plus five on the release PR). Tag builds are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtss2-dev

      - name: Build documentation
        run: |
          cargo doc --no-deps --all --release
          cp -r target/doc public
      
      - name: Verify markdown
        run: |
          sudo apt-get update
          sudo apt-get install -y markdownlint
          markdownlint README.md docs/QUICKSTART.md 2>&1 | head -50 || true
      
      - name: Upload docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: public
          retention-days: 30
