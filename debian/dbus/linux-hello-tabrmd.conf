<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  tpm2-abrmd's own policy (/etc/dbus-1/system.d/tpm2-abrmd.conf) only grants
  access to uid/gid root and tss. linux-hello deliberately does not add
  unprivileged users to the tss group (see issue #152) — a per-user
  hello-daemon instead reaches the TPM Access Broker & Resource Manager as
  an ordinary logged-in user, so it needs its own grant here.

  This is the intended use of an access broker: it session-isolates TPM
  handles per D-Bus connection specifically so arbitrary unprivileged
  clients can share one TPM safely. Opening send/receive to every user is
  not a broadening of trust beyond what tpm2-abrmd already exists to
  provide — note this deliberately omits "own", which stays root/tss-only
  per tpm2-abrmd's own policy.
-->
<busconfig>
  <policy context="default">
    <allow send_destination="com.intel.tss2.Tabrmd"/>
    <allow receive_sender="com.intel.tss2.Tabrmd"/>
  </policy>
</busconfig>
